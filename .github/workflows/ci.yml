name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Used by the server API tests and the daemon tests; each test makes (and drops) its own database.
      TEST_DATABASE_URL: postgres://postgres:pw@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --exclude familiar-desktop
      - run: cargo test --workspace --exclude familiar-desktop
      # Warnings are allowed for now (no -D warnings); tighten once the backlog is clean.
      - run: cargo clippy --workspace --exclude familiar-desktop

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web typecheck
      - run: pnpm --filter web build

  # The native desktop app (the product): its own Cargo workspace and pinned toolchain (apps/native/rust-toolchain.toml).
  native:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/native -> target
      - run: cargo test --workspace
        working-directory: apps/native

  # The native app on macOS (Apple Silicon runner): build, test, then launch it. There is no Mac on the team, so this
  # job is the macOS check: the bench smoke and a first start on a clean account (built-in database download, the
  # data folder, `--quit`), each with a screenshot in the job's artifacts.
  native-macos:
    runs-on: macos-14
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/native -> target
            . -> target
      - run: cargo test --workspace
        working-directory: apps/native
      # fish, so the login-shell PATH command is tried in it too (login_path.rs).
      - run: brew install fish || true
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
      # The core's macOS paths (protected folders, the login-shell PATH); the root workspace's own toolchain.
      - run: cargo test -p familiar-core -p familiar-host --lib
      - run: cargo build
        working-directory: apps/native
      - name: Smoke test (bench window, then a first start)
        # The built-in database is found through the GitHub API, whose anonymous limit runners share and exhaust.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash apps/native/dist/macos/smoke.sh apps/native/target/debug/familiar-native smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-smoke
          path: smoke/
          if-no-files-found: ignore

  # The legacy Tauri app, kept compiling until it is removed.
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # the Tauri build embeds apps/web/dist
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web build
      - run: cargo check -p familiar-desktop
