name: Release

# Push a tag like v0.1.0 and GitHub builds the Windows installer and the macOS app, signs them for in-app updates and
# attaches them to a release. Users download Familiar-<version>-setup.exe or Familiar-<version>.dmg; nobody has to
# compile anything. Running it by hand (workflow_dispatch) is always a dry run: everything is built and signed with a
# throwaway key, nothing is published, and the production key is never touched.
#
# Supply chain: every action is pinned to a full commit SHA (version in the comment). Only the publish job can write
# to the repository or read the signing key, and only for a pushed v* tag: the key lives in the `release` environment
# (required reviewer, v* tags only), not in the repository's secrets. The build jobs are read-only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the leading v (e.g. 0.1.0)"
        required: true
      dry_run:
        description: "Ignored: a run started by hand never publishes (only a pushed v* tag does)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Version
        id: version
        shell: pwsh
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $v = if ($env:EVENT -eq "push") { $env:REF_NAME.TrimStart("v") } else { $env:INPUT_VERSION }
          if ($v -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$') { throw "bad version '$v'" }
          "value=$v" >> $env:GITHUB_OUTPUT
          # The commit's time: updates signed before it are refused (see updates/mod.rs, BUILT_AT).
          "built_at=$(git log -1 --format=%ct)" >> $env:GITHUB_OUTPUT

      # apps/native pins its toolchain in rust-toolchain.toml; rustup installs it on the first cargo call.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/native -> target

      - name: Build native app (release)
        working-directory: apps/native
        env:
          # The app's version (Settings, and what in-app updates compare against); see updates/mod.rs.
          FAMILIAR_VERSION: ${{ steps.version.outputs.value }}
          FAMILIAR_BUILT_AT: ${{ steps.version.outputs.built_at }}
        run: cargo build --release --locked

      - name: Stage package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force stage | Out-Null
          Copy-Item apps/native/target/release/familiar-native.exe stage
          Copy-Item LICENSE stage
          Copy-Item apps/native/THIRD_PARTY_NOTICES.md stage

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=$env:VERSION" "/DPackageDir=$PWD\stage" "/DOutputDir=$PWD\out" apps/native/dist/windows/familiar.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Get-FileHash out\*.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content out\SHA256SUMS.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-installer
          path: out/
          if-no-files-found: error
          # Only for the publish (or dry-run) job of this run.
          retention-days: 1

  # macOS: one universal binary (Apple Silicon + Intel) in Familiar.app, signed ad hoc (no Apple Developer account
  # yet, so not notarized: the release notes say how to open it the first time). Familiar-<v>.dmg installs it;
  # Familiar-<v>-macos.tar.gz is the same .app for in-app updates.
  build-macos:
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT" = "push" ]; then v="${REF_NAME#v}"; else v="$INPUT_VERSION"; fi
          if ! [[ $v =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then echo "bad version '$v'"; exit 1; fi
          echo "value=$v" >> "$GITHUB_OUTPUT"
          echo "built_at=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/native -> target

      # The pinned toolchain (apps/native/rust-toolchain.toml) with both Mac targets.
      - name: Add the Apple Silicon and Intel targets
        working-directory: apps/native
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Build native app (release, universal)
        working-directory: apps/native
        env:
          FAMILIAR_VERSION: ${{ steps.version.outputs.value }}
          FAMILIAR_BUILT_AT: ${{ steps.version.outputs.built_at }}
          MACOSX_DEPLOYMENT_TARGET: "14.0"
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          mkdir -p target/universal
          lipo -create -output target/universal/familiar-native \
            target/aarch64-apple-darwin/release/familiar-native target/x86_64-apple-darwin/release/familiar-native
          lipo -info target/universal/familiar-native

      - name: Familiar.app, disk image and update archive
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          bash apps/native/dist/macos/bundle.sh apps/native/target/universal/familiar-native "$VERSION" stage
          mkdir -p out dmg
          cp -R stage/Familiar.app dmg/
          ln -s /Applications dmg/Applications
          cp "apps/native/dist/macos/First launch.txt" dmg/
          # hdiutil now and then fails with "Resource busy" on the runners: try again a few times.
          for i in 1 2 3 4 5; do
            hdiutil create -volname "Familiar $VERSION" -srcfolder dmg -fs HFS+ -format UDZO -ov "out/Familiar-$VERSION.dmg" && break
            [ "$i" -lt 5 ] || exit 1
            echo "hdiutil create failed (try $i), again in $((i * 5)) s"
            sleep $((i * 5))
          done
          COPYFILE_DISABLE=1 tar -czf "out/Familiar-$VERSION-macos.tar.gz" -C stage Familiar.app
          (cd out && shasum -a 256 *.dmg *.tar.gz > SHA256SUMS-macos.txt)
          cat out/SHA256SUMS-macos.txt

      # What the user gets: the disk image mounts, holds the signed app and the Applications link, and the app runs
      # (both slices) and knows its version.
      - name: Check the disk image
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          mnt=$(mktemp -d)
          # hdiutil is flaky on the runners ("Resource busy"): a few tries, the last detach forced.
          for i in 1 2 3 4 5; do
            hdiutil attach "out/Familiar-$VERSION.dmg" -nobrowse -readonly -mountpoint "$mnt" && break
            [ "$i" -lt 5 ] || exit 1
            echo "hdiutil attach failed (try $i), again in $((i * 5)) s"
            sleep $((i * 5))
          done
          test -L "$mnt/Applications"
          codesign --verify --deep --strict "$mnt/Familiar.app"
          for arch in arm64 x86_64; do
            out=$(arch -$arch "$mnt/Familiar.app/Contents/MacOS/familiar-native" --version)
            echo "$arch: $out"
            [ "$out" = "familiar-native $VERSION" ]
          done
          for i in 1 2 3 4 5; do
            if [ "$i" -eq 1 ]; then hdiutil detach "$mnt" && break; else hdiutil detach -force "$mnt" && break; fi
            [ "$i" -lt 5 ] || exit 1
            echo "hdiutil detach failed (try $i), again in $((i * 3)) s"
            sleep $((i * 3))
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-app
          path: out/
          if-no-files-found: error
          # Only for the publish (or dry-run) job of this run.
          retention-days: 1

  # A pushed v* tag only: signs every artifact for in-app updates (scripts/sign-release.mjs with the release key, which
  # the app trusts), writes the signed manifest (familiar-update.json: version, what's new, each file's size and
  # SHA-256) and the checksum list, and publishes. The key is the `release` environment's FAMILIAR_UPDATE_KEY: that
  # environment has the owner as required reviewer and admits v* tags only, so a branch or a run started by hand can
  # never read it. Every build job's artifacts are picked up.
  publish:
    needs: [build-windows, build-macos]
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The release notes' install steps, the signing script and the public key it checks the secret against (no
      # credentials kept).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: |
            apps/native/dist/release-notes.md
            apps/native/dist/familiar-update.pub
            scripts/sign-release.mjs
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Collect the release files
        env:
          VERSION: ${{ needs.build-windows.outputs.version }}
        run: |
          mkdir release
          shopt -s nullglob
          for f in artifacts/*.exe artifacts/*.dmg artifacts/*.tar.gz; do mv "$f" release/; done
          ls -l release
          test -f "release/Familiar-$VERSION-setup.exe"
          test -f "release/Familiar-$VERSION.dmg"
          test -f "release/Familiar-$VERSION-macos.tar.gz"

      # What's new (the merged pull requests since the last release), signed into the manifest: Settings shows it.
      - name: What's new
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.build-windows.outputs.version }}
        run: |
          if ! gh api "repos/$REPO/releases/generate-notes" -f tag_name="v$VERSION" -f target_commitish="$GITHUB_SHA" \
              --jq .body > whats-new.md; then
            echo "Familiar $VERSION" > whats-new.md
          fi
          cat whats-new.md

      - name: Sign
        env:
          FAMILIAR_UPDATE_KEY: ${{ secrets.FAMILIAR_UPDATE_KEY }}
          VERSION: ${{ needs.build-windows.outputs.version }}
        run: |
          node scripts/sign-release.mjs --version "$VERSION" --dir release --pubkey apps/native/dist/familiar-update.pub --notes whats-new.md
          cat release/SHA256SUMS.txt

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ needs.build-windows.outputs.version }}
          name: Familiar ${{ needs.build-windows.outputs.version }}
          # Pre-release versions (0.1.0-alpha.3) are pre-releases: only "Early versions" installs them.
          prerelease: ${{ contains(needs.build-windows.outputs.version, '-') }}
          body_path: apps/native/dist/release-notes.md
          generate_release_notes: true
          files: release/*

  # A run started by hand: the same signing step with a throwaway key made inside the run (its public half is kept
  # next to the files), so the script and the release layout are checked without the release key. No environment, no
  # write access; nothing it signs is trusted by any app, and the files are kept for a day.
  dry-run:
    needs: [build-windows, build-macos]
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: scripts/sign-release.mjs
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Collect the release files
        env:
          VERSION: ${{ needs.build-windows.outputs.version }}
        run: |
          mkdir release
          shopt -s nullglob
          for f in artifacts/*.exe artifacts/*.dmg artifacts/*.tar.gz; do mv "$f" release/; done
          ls -l release
          test -f "release/Familiar-$VERSION-setup.exe"
          test -f "release/Familiar-$VERSION.dmg"
          test -f "release/Familiar-$VERSION-macos.tar.gz"

      - name: Sign with a throwaway key
        env:
          VERSION: ${{ needs.build-windows.outputs.version }}
        run: |
          echo "Dry run of Familiar $VERSION (not a release)." > whats-new.md
          node scripts/sign-release.mjs --version "$VERSION" --dir release --throwaway-key throwaway.pub --notes whats-new.md
          mv throwaway.pub release/
          cat release/SHA256SUMS.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dry-run-signed-with-throwaway-key
          path: release/
          if-no-files-found: error
          retention-days: 1
