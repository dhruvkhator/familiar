name: Release

# Push a tag like v0.1.0 (or run manually) and GitHub builds the Windows installer and attaches it to a release.
# Users download Familiar-<version>-setup.exe; nobody has to compile anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the leading v (e.g. 0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        shell: pwsh
        run: |
          $v = if ("${{ github.event_name }}" -eq "push") { "${{ github.ref_name }}".TrimStart("v") } else { "${{ inputs.version }}" }
          "value=$v" >> $env:GITHUB_OUTPUT

      # apps/native pins its toolchain in rust-toolchain.toml; rustup installs it on first cargo call.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/native -> target

      - name: Build native app (release)
        working-directory: apps/native
        run: cargo build --release --locked

      - name: Stage package
        shell: pwsh
        run: |
          $stage = "stage"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item apps/native/target/release/familiar-native.exe $stage
          Copy-Item LICENSE $stage
          Copy-Item apps/native/THIRD_PARTY_NOTICES.md $stage

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=${{ steps.version.outputs.value }}" "/DPackageDir=$PWD\stage" "/DOutputDir=$PWD\out" apps/native/dist/windows/familiar.iss
          Get-FileHash out\*.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content out\SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: Familiar ${{ steps.version.outputs.value }}
          draft: false
          prerelease: true
          generate_release_notes: true
          files: |
            out/*.exe
            out/SHA256SUMS.txt
