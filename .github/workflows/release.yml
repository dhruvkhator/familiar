name: Release

# Push a tag like v0.1.0 (or run manually) and GitHub builds the Windows installer and attaches it to a release.
# Users download Familiar-<version>-setup.exe; nobody has to compile anything.
#
# Supply chain: every action is pinned to a full commit SHA (version in the comment), and only the small publish job
# can write to the repository; the build job is read-only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the leading v (e.g. 0.1.0)"
        required: true

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Version
        id: version
        shell: pwsh
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $v = if ($env:EVENT -eq "push") { $env:REF_NAME.TrimStart("v") } else { $env:INPUT_VERSION }
          if ($v -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$') { throw "bad version '$v'" }
          "value=$v" >> $env:GITHUB_OUTPUT

      # apps/native pins its toolchain in rust-toolchain.toml; rustup installs it on the first cargo call.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/native -> target

      - name: Build native app (release)
        working-directory: apps/native
        run: cargo build --release --locked

      - name: Stage package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force stage | Out-Null
          Copy-Item apps/native/target/release/familiar-native.exe stage
          Copy-Item LICENSE stage
          Copy-Item apps/native/THIRD_PARTY_NOTICES.md stage

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=$env:VERSION" "/DPackageDir=$PWD\stage" "/DOutputDir=$PWD\out" apps/native/dist/windows/familiar.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Get-FileHash out\*.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content out\SHA256SUMS.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-installer
          path: out/
          if-no-files-found: error

  publish:
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-installer
          path: out

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ needs.build-windows.outputs.version }}
          name: Familiar ${{ needs.build-windows.outputs.version }}
          prerelease: true
          generate_release_notes: true
          files: |
            out/*.exe
            out/SHA256SUMS.txt
