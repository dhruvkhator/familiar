[package]
name = "familiar-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Familiar desktop app: tray shell hosting familiar-core"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
familiar-host = { path = "../../../crates/familiar-host" }
# custom-protocol: always serve the bundled UI (apps/web/dist), never a dev server.
tauri = { version = "2", features = ["tray-icon", "custom-protocol"] }
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"
