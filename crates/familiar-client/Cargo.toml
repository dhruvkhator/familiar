[package]
name = "familiar-client"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Typed async Rust client for the Familiar HTTP API (rows, SWR cache, live SSE stream)"

[dependencies]
bytes = "1"
chrono = { version = "0.4.45", features = ["serde"] }
futures-util = "0.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2"
tokio = { version = "1.53.1", features = ["rt", "time", "sync", "macros"] }
tracing = "0.1.44"
url = "2.5.8"
uuid = { version = "1.26.1", features = ["serde"] }

[dev-dependencies]
familiar-server = { path = "../familiar-server" }
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls"] }
tokio = { version = "1.53.1", features = ["full", "test-util"] }
uuid = { version = "1.26.1", features = ["serde", "v4"] }
