[package]
name = "familiar-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
croner = "4.0.0"
directories = "6.0.0"
futures-util = "0.3.34"
hostname = "0.4.2"
http = "1.5.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rmcp = { version = "3.5.0", features = ["server", "transport-streamable-http-server", "macros"] }
rusty-s3 = "0.10.2"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "uuid", "chrono", "json", "macros", "migrate"] }
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = "0.30.0"
tokio-util = "0.7.19"
toml = "1.1.6"
# Telegram approvals write out hidden characters by Unicode general category, like the app's approval cards.
unicode-properties = { version = "0.1.4", default-features = false, features = ["general-category"] }
tracing = "0.1.44"
uuid = { version = "1.26.1", features = ["v4", "serde"] }
# The CRM checks that a link is a well-formed http(s) URL.
url = "2.5.8"
familiar-crypto ={ version = "0.1.0", path = "../familiar-crypto" }
# The approval card's small picture of the screen around a desktop step's target.
png = "0.18.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }
