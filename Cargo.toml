[workspace]
resolver = "3"
exclude = ["apps/native"]  # own workspace: GPUI and Tauri pin conflicting build deps
members = [
    "crates/familiar-crypto", "crates/familiar-core", "crates/familiar-server", "crates/familiard", "crates/familiar-testkit", "crates/familiar-client", "crates/familiar-host", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

# Password hashing is deliberately slow; optimise it even in debug builds so tests stay fast.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

